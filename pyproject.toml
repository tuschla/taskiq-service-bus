[project]
name = "taskiq-service-bus"
version = "0.3.0"
description = "Azure servicebus broker for taskiq"
authors = [
    {name = "Hamilton Kibbe", email = "ham@hamiltonkib.be"}
]
maintainers = [
    {name = "Hamilton Kibbe", email = "ham@hamiltonkib.be"}
]
readme = "README.md"
license = "MIT"
license-file = "LICENSE"
classifiers = [
    "Typing :: Typed",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking",
    "Development Status :: 3 - Alpha",
]
homepage = "https://github.com/hamiltonkibbe/taskiq-service-bus"
repository = "https://github.com/hamiltonkibbe/taskiq-service-bus"
keywords = ["taskiq", "azure", "service bus", "servicebus"]
requires-python = ">=3.10,<4"
dependencies = [
    "azure-servicebus>=7.14.3",
    "taskiq>=0.12.1,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.0",
]



[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "taskiq_service_bus"
module-root = ""


[tool.ruff]
target-version = "py310"

lint.select = [
    "ASYNC", # flake8-async
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "D", # pydocstyle
    "E",   # pycodestyle
    "ERA", # eradicate
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PL",  # Pylint
    "PTH", # flake8-use-pathlib
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "RUF", # ruff-specific rules
    "S",   # Bandit
    "SIM", # flake8-simplify
    "SLF", # flake8-self
    "T20", # flake8-print
    "UP",  # pyupgrade
    "W",   # pycodestyle
]


[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "SLF001"]
